# Render Blueprint - provisions the backend API automatically.
#
# In Render: New -> Blueprint -> select this repository. Render reads this file
# and creates the service with the settings below.
#
# Values marked sync:false are NOT stored in the repo. Render prompts for them
# during setup (or you add them later under Environment). Secrets never belong
# in this file.
services:
  - type: web
    name: medchain-api
    runtime: node
    plan: free
    region: singapore # closest free region to India; oregon/frankfurt also fine
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Auto-generated by Render, unique to this service. Nothing to paste.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      # ---- Blockchain: Sepolia (public values, safe to commit) ----
      - key: RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: CHAIN_ID
        value: "11155111"
      - key: CONTRACT_ADDRESS
        value: "0xAE246FCcad4F7aF88C1c6B3d17FaF2105D345824"
      - key: EXPLORER_BASE
        value: https://sepolia.etherscan.io

      - key: MAX_UPLOAD_BYTES
        value: "15728640"

      # ---- Set these in the Render dashboard ----
      # Your exact Vercel URL, no trailing slash. Set after Vercel deploy.
      - key: CORS_ORIGINS
        sync: false
      # Optional: MongoDB Atlas connection string. Empty = in-memory store.
      - key: MONGODB_URI
        sync: false
      # Optional: Pinata JWT. Empty = local content-addressed storage.
      - key: PINATA_JWT
        sync: false
      - key: PINATA_GATEWAY
        value: https://gateway.pinata.cloud
      - key: PUBLIC_IPFS_GATEWAY
        value: https://ipfs.io

      # ---- Bootstrap admin ----
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
